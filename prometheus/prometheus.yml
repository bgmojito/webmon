global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['webmon-alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['webmon-node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['webmon-cadvisor:8080']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['webmon-postgres-exporter:9187']
  - job_name: 'backend'
    static_configs:
      - targets: ['webmon-backend:3001']
